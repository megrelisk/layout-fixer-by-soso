name: Build

on:
  push:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  # Only for the API fallback in CI: runners share addresses and hit the
  # unauthenticated rate limit. The app itself never uses a token.
  GITHUB_TOKEN: ${{ github.token }}

# One build at a time per branch, so two pushes never race to publish the release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt spylls pytest pyinstaller

      - name: Build dictionaries
        run: python build_dicts.py

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Windows smoke test
        run: python tools/windows_smoke_test.py

      - name: Detection quality
        run: python tools/evaluate.py 3000

      - name: Spelling quality
        run: python tools/evaluate_spell.py 3000

      - name: Early fix quality
        run: python tools/evaluate_early.py 3000

      - name: Line context quality
        run: python tools/evaluate_context.py 1500

      - name: Build an "old" exe for the self-update test
        shell: bash
        run: |
          printf 'COMMIT = "0000000-old"\nBUILT = "test"\n' > version.py
          pyinstaller --noconfirm --onefile --noconsole --name LayoutFixerOld \
            --add-data "dicts;dicts" --hidden-import pystray._win32 --hidden-import tkinter app.py

      - name: Self-update end to end (real exe updates itself from the release)
        run: |
          $d = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\upd"
          Copy-Item dist\LayoutFixerOld.exe "$d\LayoutFixer.exe"
          $log = "$env:APPDATA\LayoutFixer\log.txt"
          # -Wait would also wait for the new version it starts, which keeps running.
          $p = Start-Process "$d\LayoutFixer.exe" -ArgumentList "--update-now" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process $p -Force; throw "--update-now hung" }
          "exit code: $($p.ExitCode)"
          Start-Sleep 20
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          Get-ChildItem $d | Format-Table Name, Length
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Headers $headers https://api.github.com/repos/${{ github.repository }}/releases/latest
          $asset = $rel.assets | Where-Object name -eq "LayoutFixer.exe"
          $hash = (Get-FileHash "$d\LayoutFixer.exe" -Algorithm SHA256).Hash.ToLower()
          $running = Get-Process LayoutFixer -ErrorAction SilentlyContinue
          "running: $($running.Count), hash ok: $("sha256:$hash" -eq $asset.digest), old left: $(Test-Path "$d\LayoutFixer.old.exe")"
          Stop-Process -Name LayoutFixer -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "update failed" }
          if ("sha256:$hash" -ne $asset.digest) { throw "exe was not replaced by the release" }
          if (-not $running) { throw "the new version did not start" }
          if (Test-Path "$d\LayoutFixer.old.exe") { throw "old exe was not removed" }

      - name: Stamp version
        shell: bash
        run: printf 'COMMIT = "%s"\nBUILT = "%s"\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > version.py

      - name: Build LayoutFixer.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name LayoutFixer
          --add-data "dicts;dicts" --hidden-import pystray._win32 --hidden-import tkinter app.py

      - name: Describe the build (version.json, read by the app's updater)
        run: python tools/version_json.py dist/LayoutFixer.exe dist/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: LayoutFixer
          path: |
            dist/LayoutFixer.exe
            dist/version.json

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/LayoutFixer.exe dist/version.json \
            --title "LayoutFixer" --target "$GITHUB_SHA" \
            --notes "Автоисправление раскладки EN / RU / KA для Windows. Скачайте LayoutFixer.exe и запустите."
